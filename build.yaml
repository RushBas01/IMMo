name: Build Flutter App (Android & iOS)

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    name: Build APK and IPA
    runs-on: macos-latest # ضروري جداً لتجميع حزم الآيفون والأندرويد معاً

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.x' # يمكنك تحديد إصدار فلاتر الذي تستخدمه
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      # 1. بناء تطبيق الأندرويد (APK)
      - name: Build Android APK
        run: flutter build apk --release

      # 2. بناء تطبيق الآيفون (IPA) - يتطلب شهادة توقيع أو بناء تجريبي (Release/Profile)
      - name: Build iOS IPA
        run: flutter build ipa --release --no-codesign

      # رفع ملفات الأندرويد لتمكن تحميلها من صفحة الـ Actions
      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk

      # رفع ملفات الآيفون لتمكن تحميلها
      - name: Upload iOS IPA
        uses: actions/upload-artifact@v4
        with:
          name: app-release-ipa
          path: build/ios/ipa/*.ipa
